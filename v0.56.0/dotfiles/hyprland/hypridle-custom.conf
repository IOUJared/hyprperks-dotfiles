# Maintained custom idle configuration; respect default inhibitors.

general {
    lock_cmd = pidof hyprlock || hyprlock --config /home/jared/.config/hypr/hyprlock-custom.conf
    before_sleep_cmd = pidof hyprlock || hyprlock --config /home/jared/.config/hypr/hyprlock-custom.conf
    # Blank only after the compositor confirms locking (including manual locks).
    on_lock_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on_unlock_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 300 # 5 minutes
    on-timeout = loginctl lock-session
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
