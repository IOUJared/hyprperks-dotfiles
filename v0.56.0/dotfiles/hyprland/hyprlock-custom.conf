# Maintained custom lock configuration; keep generated theme colors.

source=./hyprlockColors.conf

general {
    hide_cursor = true
}


background {
    monitor =
    path =screenshot
    color = $background
    blur_passes = 4
    blur_size = 7
}

image {
    path = ~/avatar.jpg

    position = 0, 200

    rounding = 75
    border_size = 3
    border_color = $primary_fixed
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi <span style="italic">$USER</span>
    color = $on_surface
    position = 0, 100
    font_size = 25
    font_family = Noto Sans

    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
    shadow_boost = 1.5
}

label {
    monitor =
    text = <span weight="bold">$TIME</span>
    position = 0, 5
    font_size = 40
    font_family = Noto Sans
    color = $on_surface

    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 2
    outer_color = $primary_fixed
    inner_color = $surface_container
    font_color = $on_surface
    check_color = $secondary
    fail_color = $error
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow
    fade_on_empty = false
    dots_center = true
    halign = center
    valign = center
}
